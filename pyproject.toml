[project]
name = "pymickey"
version = "0.1.3"
description = "Minimal declarative HTTP API testing tool with YAML scenarios"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Askhat Molkenov", email = "askhat.molkenov@gmail.com" }
]

dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.scripts]
pymickey = "pymickey.cli:cli"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["pymickey_tests*"]