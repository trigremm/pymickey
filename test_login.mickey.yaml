config:
  base_url: "{{ base_url }}"
  default_headers:
    Content-Type: "application/json"
    Authorization: "Bearer {{ access_token }}" # to be filled after login

  auth:
    login:
      name: "Логин"
      request:
        method: POST
        url: "{{ base_url }}/api/v1/auth/login/password/"
        headers: {} # empty to avoid default headers being sent
        json:
          email: "{{ admin_email }}"
          password: "{{ admin_password }}"
      expect:
        status: 200
        json:
          has_keys: ["access"]
      extract:
        access_token: "json.access"

tests:
  - name: "Получение профиля"
    # можно ещё и на уровне теста требовать наличие токена
    demand: ["access_token"]

    steps:
      - name: "GET /me"
        request:
          method: GET
          url: "{{ base_url }}/api/v1/auth/me/"
        expect:
          status: 200
          json:
            has_keys: ["id", "email"]
